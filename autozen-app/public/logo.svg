      <stop offset="0" stop-color="#e8edf2"/>
      <stop offset="0.55" stop-color="#9fb2c0"/>
      <stop offset="1" stop-color="#16c5d4"/>
    </linearGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#16c5d4"/>
      <stop offset="1" stop-color="#5b6b78"/>
