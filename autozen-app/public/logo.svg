<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" fill="none">
  <defs>
    <linearGradient id="silver" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0" stop-color="#f4f7fa"/>
      <stop offset="0.5" stop-color="#cdd8e0"/>
      <stop offset="1" stop-color="#8a9aa8"/>
    </linearGradient>
    <linearGradient id="cyan" x1="0" y1="0" x2="0.5" y2="1">
      <stop offset="0" stop-color="#5fe3ee"/>
      <stop offset="0.5" stop-color="#16c5d4"/>
      <stop offset="1" stop-color="#0a8e9b"/>
    </linearGradient>
    <linearGradient id="ringg" x1="0.1" y1="0" x2="0.9" y2="1">
      <stop offset="0" stop-color="#16c5d4"/>
      <stop offset="0.5" stop-color="#7d8d9a"/>
      <stop offset="1" stop-color="#e8edf2"/>
    </linearGradient>
  </defs>

  <!-- broken ring -->
  <path d="M 388 78 A 130 130 0 1 1 168 96" stroke="url(#ringg)" stroke-width="11" stroke-linecap="round" fill="none"/>

  <!-- A (silver) -->
  <path d="M 196 250 L 248 95 L 272 95 L 250 160 L 224 160 Z" fill="url(#silver)"/>
  <path d="M 232 172 L 274 172 L 266 196 L 224 196 Z" fill="url(#silver)"/>
  <path d="M 250 160 L 272 95 L 286 138 L 268 196 Z" fill="url(#silver)" opacity="0.9"/>

  <!-- Z (cyan) -->
  <path d="M 270 95 L 360 95 L 360 116 L 312 116 L 360 230 L 270 230 L 270 209 L 320 209 L 270 116 Z" fill="url(#cyan)"/>

  <!-- wordmark -->
  <text x="280" y="330" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="74" font-weight="800" letter-spacing="8">
    <tspan fill="url(#silver)">AUTO</tspan><tspan fill="url(#cyan)">ZEN</tspan>
  </text>
  <text x="280" y="366" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#8a99a8" letter-spacing="1.5">Tranquilidade e eficiência na gestão do seu negócio.</text>
</svg>
